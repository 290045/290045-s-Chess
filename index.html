
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #171717;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 850px;
  display: flex;
  gap: 25px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}

#board {
  width: min( min(80vw, 560px), 560px);
  aspect-ratio: 1 / 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  border: 5px solid #292929;
  border-radius: 4px;
  overflow: hidden;
}

.square {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  aspect-ratio: 1 / 1;
  cursor: pointer;
  user-select: none;
}

.light {
  background: #eeeed2;
}

.dark {
  background: #769656;
}

.square.selected {
  background: #baca44;
}

.square.legal::after {
  content: "";
  position: absolute;
  width: 25%;
  height: 25%;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.22);
}

.square.capture::after {
  content: "";
  position: absolute;
  inset: 5%;
  border: 5px solid rgba(0, 0, 0, 0.22);
  border-radius: 50%;
}

.piece {
  position: relative;
  z-index: 1;
  font-family: "DejaVu Sans", "Segoe UI Symbol", sans-serif;
  font-size: clamp(30px, 7vw, 58px);
  line-height: 1;
  font-weight: normal;
}

.piece.white {
  color: #fff;
  text-shadow: 0 1px 2px #555;
}

.piece.black {
  color: #111;
  text-shadow: 0 1px 1px #777;
}

.panel {
  width: 230px;
  background: #242424;
  padding: 20px;
  border-radius: 10px;
}

h1 {
  margin-top: 0;
  font-size: 26px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  background: #769656;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #668545;
}

#status {
  margin: 15px 0;
  color: #ddd;
}

#history {
  max-height: 220px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.8;
  color: #ddd;
}

@media (max-width: 650px) {
  .container {
    flex-direction: column;
    align-items: center;
  }

  .panel {
    width: min(100%, 560px);
  }
}
</style>
</head>

<body>

<div class="container">
  <div id="board"></div>

  <div class="panel">
    <h1>Chess</h1>
    <div id="status">White to move</div>

    <button onclick="undo()">Undo Move</button>
    <button onclick="restart()">Restart Game</button>

    <h3>Move History</h3>
    <div id="history"></div>
  </div>
</div>

<script>
const game = new Chess();

let selectedSquare = null;
let legalMoves = [];

const pieces = {
  wk: "♔", wq: "♕", wr: "♖",
  wb: "♗", wn: "♘", wp: "♙",
  bk: "♚", bq: "♛", br: "♜",
  bb: "♝", bn: "♞", bp: "♟"
};

function render() {
  const boardElement = document.getElementById("board");
  boardElement.innerHTML = "";

  const board = game.board();

  // Rank 8 is at the top; rank 1 (White's side) is at the bottom.
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const square = document.createElement("div");
      const file = "abcdefgh"[c];
      const rank = 8 - r;
      const squareName = file + rank;

      square.className = "square " +
        ((r + c) % 2 === 0 ? "light" : "dark");

      if (selectedSquare === squareName) {
        square.classList.add("selected");
      }

      const move = legalMoves.find(m => m.to === squareName);
      if (move) {
        square.classList.add(
          game.get(squareName) ? "capture" : "legal"
        );
      }

      const piece = board[r][c];

      if (piece) {
        const span = document.createElement("span");
        span.className = "piece " +
          (piece.color === "w" ? "white" : "black");

        span.textContent = pieces[piece.color + piece.type];
        square.appendChild(span);
      }

      square.addEventListener("click", () => clickSquare(squareName));
      boardElement.appendChild(square);
    }
  }

  updateInfo();
}

function clickSquare(square) {
  if (game.game_over()) return;

  const piece = game.get(square);

  if (selectedSquare) {
    const move = game.move({
      from: selectedSquare,
      to: square,
      promotion: "q"
    });

    if (move) {
      selectedSquare = null;
      legalMoves = [];
      render();
      return;
    }
  }

  if (piece && piece.color === game.turn()) {
    selectedSquare = square;
    legalMoves = game.moves({
      square: square,
      verbose: true
    });
  } else {
    selectedSquare = null;
    legalMoves = [];
  }

  render();
}

function updateInfo() {
  const status = document.getElementById("status");
  const history = document.getElementById("history");

  if (game.in_checkmate()) {
    status.textContent = "Checkmate!";
  } else if (game.in_draw()) {
    status.textContent = "Draw!";
  } else if (game.in_check()) {
    status.textContent =
      (game.turn() === "w" ? "White" : "Black") + " is in check!";
  } else {
    status.textContent =
      (game.turn() === "w" ? "White" : "Black") + " to move";
  }

  const moves = game.history();
  history.innerHTML = "";

  for (let i = 0; i < moves.length; i += 2) {
    const line = document.createElement("div");
    line.textContent =
      (Math.floor(i / 2) + 1) + ". " +
      moves[i] + (moves[i + 1] ? " " + moves[i + 1] : "");
    history.appendChild(line);
  }
}

function undo() {
  game.undo();
  selectedSquare = null;
  legalMoves = [];
  render();
}

function restart() {
  game.reset();
  selectedSquare = null;
  legalMoves = [];
  render();
}

render();
</script>

</body>
</html>
