
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #202020;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 900px;
  display: flex;
  gap: 25px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}

#board {
  width: min(80vw, 600px);
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  border: 5px solid #292929;
  overflow: hidden;
  border-radius: 4px;
}

.square {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  cursor: pointer;
  user-select: none;
}

.light { background: #eeeed2; }
.dark { background: #769656; }

.square.selected {
  background: #baca44;
}

.piece {
  width: 92%;
  height: 92%;
  position: relative;
  z-index: 1;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.piece svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

.square.legal::after {
  content: "";
  position: absolute;
  width: 25%;
  height: 25%;
  border-radius: 50%;
  background: rgba(0,0,0,.22);
}

.square.capture::after {
  content: "";
  position: absolute;
  inset: 5%;
  border: 5px solid rgba(0,0,0,.22);
  border-radius: 50%;
}

.panel {
  width: 230px;
  background: #303030;
  padding: 20px;
  border-radius: 10px;
}

h1 {
  margin-top: 0;
  font-size: 26px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  background: #769656;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #668545;
}

#status {
  margin: 15px 0;
  color: #ddd;
}

#history {
  max-height: 220px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.8;
  color: #ddd;
}

@media (max-width: 650px) {
  .container {
    flex-direction: column;
    align-items: center;
  }

  .panel {
    width: min(100%, 560px);
  }
}
</style>
</head>

<body>

<div class="container">
  <div id="board"></div>

  <div class="panel">
    <h1>Chess</h1>
    <div id="status">White to move</div>

    <button onclick="undo()">Undo Move</button>
    <button onclick="restart()">Restart Game</button>

    <h3>Move History</h3>
    <div id="history"></div>
  </div>
</div>

<script>
const game = new Chess();

let selectedSquare = null;
let legalMoves = [];

function pieceSVG(piece) {
  const white = piece.color === "w";

  const fill = white ? "#ffffff" : "#171717";
  const outline = white ? "#777777" : "#555555";

  const shapes = {

    // KING
    k: `
      <path d="
        M44 7 H56 V19 H68 V29 H56 V38
        H44 V29 H32 V19 H44 Z
      "/>
      <path d="
        M36 40
        Q27 43 29 55
        L34 75 H66 L71 55
        Q73 43 64 40 Z
      "/>
      <path d="M27 76 H73 V85 H27 Z"/>
      <path d="M18 87 H82 V96 H18 Z"/>
    `,

    // QUEEN
    q: `
      <circle cx="19" cy="20" r="8"/>
      <circle cx="40" cy="12" r="8"/>
      <circle cx="60" cy="12" r="8"/>
      <circle cx="81" cy="20" r="8"/>
      <path d="
        M18 29
        L30 65 H70
        L82 29 L64 45
        L60 27 L50 46
        L40 27 L36 45 Z
      "/>
      <path d="M27 67 H73 L79 82 H21 Z"/>
      <path d="M15 86 H85 V96 H15 Z"/>
    `,

    // ROOK
    r: `
      <path d="
        M16 12 H34 V27 H42 V12
        H58 V27 H66 V12 H84
        V39 H75 L70 76 H30
        L25 39 H16 Z
      "/>
      <path d="M25 78 H75 V86 H25 Z"/>
      <path d="M16 88 H84 V96 H16 Z"/>
    `,

    // BISHOP
    b: `
      <path d="
        M50 8
        C35 8 28 22 34 35
        C20 48 27 65 35 73
        H65
        C73 65 80 48 66 35
        C72 22 65 8 50 8 Z
      "/>
      <path d="M42 17 L59 42"
        fill="none"
        stroke="${outline}"
        stroke-width="5"
        stroke-linecap="round"/>
      <path d="M30 75 H70 L78 85 H22 Z"/>
      <path d="M15 88 H85 V96 H15 Z"/>
    `,

    // KNIGHT
    n: `
      <path d="
        M19 85
        L22 73
        Q28 67 30 58
        L25 47
        Q19 33 31 23
        L45 13
        L50 5
        L58 19
        L70 22
        L83 38
        L74 49
        L64 49
        L68 61
        L77 74
        L83 85
        Z
      "/>

      <path d="
        M31 25
        L38 16
        L43 28
        L34 37
        Z
      "/>

      <path d="
        M57 31
        Q65 26 72 33
        Q66 40 57 36
        Z
      " fill="${outline}" stroke="none"/>

      <path d="
        M30 50
        Q41 55 53 48
        L62 55
        L57 69
        H35
        Z
      "/>

      <path d="M25 76 H77 V86 H25 Z"/>
      <path d="M15 88 H85 V96 H15 Z"/>
    `,

    // PAWN
    p: `
      <circle cx="50" cy="24" r="17"/>
      <path d="
        M39 42
        Q34 48 34 56
        L29 75 H71
        L66 56
        Q66 48 61 42 Z
      "/>
      <path d="M26 77 H74 V86 H26 Z"/>
      <path d="M16 88 H84 V96 H16 Z"/>
    `
  };

  return `
    <svg viewBox="0 0 100 100"
         xmlns="http://www.w3.org/2000/svg">
      <g fill="${fill}"
         stroke="${outline}"
         stroke-width="2.5"
         stroke-linejoin="round"
         stroke-linecap="round">
        ${shapes[piece.type]}
      </g>
    </svg>
  `;
}

function render() {
  const boardElement = document.getElementById("board");
  boardElement.innerHTML = "";

  const board = game.board();

  // White at bottom, Black at top.
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const file = "abcdefgh"[c];
      const rank = 8 - r;
      const squareName = file + rank;

      const square = document.createElement("div");

      square.className = "square " +
        ((r + c) % 2 === 0 ? "light" : "dark");

      if (selectedSquare === squareName) {
        square.classList.add("selected");
      }

      const move = legalMoves.find(m => m.to === squareName);

      if (move) {
        square.classList.add(
          game.get(squareName) ? "capture" : "legal"
        );
      }

      const piece = board[r][c];

      if (piece) {
        const holder = document.createElement("div");
        holder.className = "piece";
        holder.innerHTML = pieceSVG(piece);
        square.appendChild(holder);
      }

      square.addEventListener("click", () => {
        clickSquare(squareName);
      });

      boardElement.appendChild(square);
    }
  }

  updateInfo();
}

function clickSquare(square) {
  if (game.game_over()) return;

  const piece = game.get(square);

  if (selectedSquare) {
    const move = game.move({
      from: selectedSquare,
      to: square,
      promotion: "q"
    });

    if (move) {
      selectedSquare = null;
      legalMoves = [];
      render();
      return;
    }
  }

  if (piece && piece.color === game.turn()) {
    selectedSquare = square;

    legalMoves = game.moves({
      square: square,
      verbose: true
    });
  } else {
    selectedSquare = null;
    legalMoves = [];
  }

  render();
}

function updateInfo() {
  const status = document.getElementById("status");
  const history = document.getElementById("history");

  if (game.in_checkmate()) {
    status.textContent = "Checkmate!";
  } else if (game.in_draw()) {
    status.textContent = "Draw!";
  } else if (game.in_check()) {
    status.textContent =
      (game.turn() === "w" ? "White" : "Black") +
      " is in check!";
  } else {
    status.textContent =
      (game.turn() === "w" ? "White" : "Black") +
      " to move";
  }

  const moves = game.history();
  history.innerHTML = "";

  for (let i = 0; i < moves.length; i += 2) {
    const line = document.createElement("div");

    line.textContent =
      (Math.floor(i / 2) + 1) + ". " +
      moves[i] +
      (moves[i + 1] ? " " + moves[i + 1] : "");

    history.appendChild(line);
  }
}

function undo() {
  game.undo();
  selectedSquare = null;
  legalMoves = [];
  render();
}

function restart() {
  game.reset();
  selectedSquare = null;
  legalMoves = [];
  render();
}

render();
</script>

</body>
</html>
